apiVersion: apps/v1
kind: Deployment
metadata:
  name: raidnow-lite
  namespace: raidnow-lite
  labels:
    app.kubernetes.io/name: raidnow-lite
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: raidnow-lite
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raidnow-lite
        app.kubernetes.io/component: web
        app.kubernetes.io/managed-by: kubectl
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: raidnow-lite
          image: ghcr.io/albinmedoc/raidnow-lite:v0.8.1
          ports:
            - name: http
              containerPort: 4173
              protocol: TCP
          envFrom:
            - configMapRef:
                name: raidnow-lite-config
            - secretRef:
                name: raidnow-lite-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: raidnow-lite
        - name: tmp
          emptyDir: {}
