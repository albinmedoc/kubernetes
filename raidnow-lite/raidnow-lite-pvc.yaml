apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: raidnow-lite
  namespace: raidnow-lite
  labels:
    app.kubernetes.io/name: raidnow-lite
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: kubectl
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 1Gi
