apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: raidnow-lite
  namespace: raidnow-lite
  labels:
    app.kubernetes.io/name: raidnow-lite
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kubectl
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`raid.pogo.albinmedoc.se`)
      kind: Rule
      services:
        - name: raidnow-lite
          port: 4173
