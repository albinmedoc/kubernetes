apiVersion: v1
kind: ConfigMap
metadata:
  name: raidnow-lite-config
  namespace: raidnow-lite
  labels:
    app.kubernetes.io/name: raidnow-lite
    app.kubernetes.io/component: configuration
    app.kubernetes.io/managed-by: kubectl
data:
  HOST: "0.0.0.0"
  PORT: "4173"
  RAIDNOW_MODE: live
  RAIDNOW_LIVE_WRITES: "true"
  RAIDNOW_DIAGNOSTICS: "false"
  RAIDNOW_POLL_INTERVAL_MS: "15000"
  PUBLIC_ORIGIN: "https://raid.pogo.albinmedoc.se"
  RAIDNOW_COOKIE_SECURE: "true"
