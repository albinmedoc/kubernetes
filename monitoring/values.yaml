kube-prometheus-stack:
  fullnameOverride: kube-prometheus-stack

  alertmanager:
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - severity = "critical"
          target_matchers:
            - severity =~ "warning|info"
          equal:
            - namespace
            - alertname
        - source_matchers:
            - severity = "warning"
          target_matchers:
            - severity = "info"
          equal:
            - namespace
            - alertname
        - source_matchers:
            - alertname = "InfoInhibitor"
          target_matchers:
            - severity = "info"
          equal:
            - namespace
        - target_matchers:
            - alertname = "InfoInhibitor"
      route:
        group_by:
          - alertname
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: "null"
        routes:
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
          - receiver: telegram
            matchers:
              - severity = "critical"
            repeat_interval: 1h
      receivers:
        - name: "null"
        - name: telegram
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
              chat_id: -5314466909
              send_resolved: true
    alertmanagerSpec:
      secrets:
        - alertmanager-telegram
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: truenas-iscsi
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

  grafana:
    enabled: true
    envFromSecret: grafana-secrets
    envFromConfigMaps:
      - name: grafana-config
    admin:
      existingSecret: grafana-secrets
      userKey: GF_SECURITY_ADMIN_USER
      passwordKey: GF_SECURITY_ADMIN_PASSWORD
    persistence:
      enabled: true
      storageClassName: truenas-iscsi
      accessModes:
        - ReadWriteOnce
      size: 10Gi

  prometheus:
    service:
      type: LoadBalancer
      loadBalancerIP: 192.168.86.6
    prometheusSpec:
      retention: 15d
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      probeSelector: {}
      probeNamespaceSelector: {}
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelector: {}
      scrapeConfigNamespaceSelector: {}
      scrapeConfigSelectorNilUsesHelmValues: false
      ruleSelector: {}
      ruleNamespaceSelector: {}
      ruleSelectorNilUsesHelmValues: false
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: truenas-iscsi
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
