apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: pve-exporter
  labels:
    app.kubernetes.io/name: pve-exporter
    app.kubernetes.io/component: metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
      app.kubernetes.io/component: metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-exporter
        app.kubernetes.io/component: metrics-exporter
    spec:
      containers:
        - name: pve-exporter
          image: ghcr.io/prometheus-pve/prometheus-pve-exporter:3.10.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: pve-exporter-secrets
          ports:
            - name: metrics
              containerPort: 9221
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
